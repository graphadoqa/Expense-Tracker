<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ansaf">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Ansaf — Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">PERSONAL FINANCE</div>
      <h1 id="pageTitle">Home</h1>
    </div>
    <button class="icon-btn" id="quickAdd" aria-label="Quick add">＋</button>
  </header>

  <main id="content"></main>

  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-tab="home"><span>⌂</span><small>Home</small></button>
    <button class="tab" data-tab="expenses"><span>↓</span><small>Expenses</small></button>
    <button class="tab" data-tab="credit"><span>↔</span><small>Credit</small></button>
    <button class="tab" data-tab="more"><span>•••</span><small>More</small></button>
  </nav>
</div>

<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2 id="modalTitle"></h2><button class="icon-btn close" id="closeModal">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
